<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Medieval Fantasy City Generator</title>
  <link rel="shortcut icon" type="image/png" href="./favicon.png">
  <script src="./mfcg.js?v=10"></script>
  <script>
    window.addEventListener("touchmove", function (event) {
      event.preventDefault();
    }, { capture: false, passive: false });

    if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
      document.getElementById("viewport").setAttribute(
        "content",
        "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no"
      );
    }
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #openfl-content {
      width: 100%;
      height: 100%;
      background: #000;
    }

    @font-face {
      font-family: "IM FELL Great Primer Roman";
      src: url("Assets/IMFellGreatPrimer-Regular.woff") format("woff");
      font-style: normal;
      font-weight: normal;
    }

    @font-face {
      font-family: "Share Tech Regular";
      src: url("Assets/ShareTech-Regular.woff") format("woff");
      font-style: normal;
      font-weight: normal;
    }

    @font-face {
      font-family: "Share Tech Mono";
      src: url("Assets/ShareTechMono-Regular.woff") format("woff");
      font-style: normal;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <noscript>This webpage requires JavaScript.</noscript>
  <div id="openfl-content"></div>
  <script>
    lime.embed("mfcg", "openfl-content", 0, 0, { parameters: {} });
  </script>
</body>
</html>
