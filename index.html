  <title>Medieval Fantasy City Generator</title>

  <script>
    // Use the browser's native download path. The bundled FileSaver fallback
    // dispatches a synthetic mouse event, which Brave and Edge may block.
    window.saveAs = function (blob, fileName) {
      if (/^text\/csv/i.test(blob.type)) {
        blob = new Blob(["\ufeff", blob], { type: "text/csv;charset=utf-8" });
      }

      if (navigator.msSaveOrOpenBlob) {
        navigator.msSaveOrOpenBlob(blob, fileName);
        return;
      }

      var urlApi = window.URL || window.webkitURL;
      var url = urlApi.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.setTimeout(function () { urlApi.revokeObjectURL(url); }, 60000);
    };

    window.addEventListener("touchmove", function (event) {
      event.preventDefault();
    }, { capture: false, passive: false });

    if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
      document.getElementById("viewport").setAttribute(
        "content",
        "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no"
      );
    }
  </script>
